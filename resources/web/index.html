<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101418">
<title>pipensx</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="brand-dot"></span>pipensx</div>
  <div id="conn" class="conn" title="connection">●</div>
</header>

<nav class="tabs">
  <a href="#downloads" data-tab="downloads" class="tab">Downloads</a>
  <a href="#catalog" data-tab="catalog" class="tab">Catalog</a>
  <a href="#add" data-tab="add" class="tab">Add</a>
  <a href="#settings" data-tab="settings" class="tab">Settings</a>
</nav>

<main>
  <section id="view-downloads" class="view">
    <div id="storage" class="storage" hidden>
      <div class="storage-bar"><div id="storage-fill" class="storage-fill"></div></div>
      <div id="storage-text" class="storage-text"></div>
    </div>
    <div id="notify-row" class="notify-row">
      <button id="alerts-btn" class="btn btn-ghost">🔔 Alerts: on</button>
      <button id="notify-btn" class="btn btn-ghost" hidden>Enable notifications</button>
    </div>
    <div id="jobs"></div>
    <div id="tasks"></div>
    <div id="tasks-empty" class="empty" hidden>
      <div class="empty-icon">⤓</div>
      <p>No downloads yet.<br>Add a magnet link or pick something from the catalog.</p>
    </div>
  </section>

  <section id="view-catalog" class="view" hidden>
    <div class="search-row">
      <input id="search" type="search" placeholder="Search 4000+ games…" autocomplete="off">
    </div>
    <div id="catalog-status" class="empty" hidden></div>
    <div id="catalog-grid" class="grid"></div>
    <div id="catalog-sentinel"></div>
  </section>

  <section id="view-add" class="view" hidden>
    <div class="card form-card">
      <h2>Magnet link</h2>
      <textarea id="magnet-input" rows="3" placeholder="magnet:?xt=urn:btih:…"></textarea>
      <div class="mode-row" id="magnet-mode">
        <label><input type="radio" name="magnet-mode" value="install" checked> Install</label>
        <label><input type="radio" name="magnet-mode" value="download"> Download only</label>
      </div>
      <button id="magnet-btn" class="btn btn-primary">Add magnet</button>
    </div>
    <div class="card form-card">
      <h2>.torrent file</h2>
      <input id="torrent-file" type="file" accept=".torrent,application/x-bittorrent">
      <div class="mode-row" id="torrent-mode">
        <label><input type="radio" name="torrent-mode" value="install" checked> Install</label>
        <label><input type="radio" name="torrent-mode" value="download"> Download only</label>
      </div>
      <button id="torrent-btn" class="btn btn-primary">Upload torrent</button>
    </div>
  </section>

  <section id="view-settings" class="view" hidden>
    <div class="card form-card">
      <h2>Downloads</h2>
      <label class="field">Concurrent downloads
        <select id="set-max-active">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
        </select>
      </label>
      <label class="field">Stream selection
        <select id="set-stream">
          <option value="allFiles">All files</option>
          <option value="packagesOnly">Packages only</option>
        </select>
      </label>
      <label class="field">Install location
        <select id="set-install">
          <option value="sdCard">SD Card</option>
          <option value="systemMemory">System Memory</option>
        </select>
      </label>
    </div>
    <div class="card form-card">
      <h2>Debrid</h2>
      <label class="field">Provider
        <select id="set-debrid">
          <option value="torbox">TorBox</option>
          <option value="torrserver">TorrServer</option>
          <option value="realdebrid">Real-Debrid</option>
        </select>
      </label>
      <label class="field">TorBox API key
        <input id="set-torbox" type="password" autocomplete="off" placeholder="">
      </label>
      <label class="field">Real-Debrid API token
        <input id="set-realdebrid" type="password" autocomplete="off" placeholder="">
      </label>
      <label class="field">TorrServer URL
        <input id="set-torrserver" type="url" placeholder="http://192.168.1.10:8090">
      </label>
    </div>
    <div class="card form-card">
      <h2>Network</h2>
      <label class="field">Proxy URL
        <input id="set-proxy" type="url" placeholder="socks5://host:1080">
      </label>
    </div>
    <div class="card form-card">
      <h2>Catalog</h2>
      <label class="field">Catalog source URL
        <input id="set-catalog-url" type="url" placeholder="https://…/switch_games.json">
      </label>
      <label class="field">Catalog filter
        <select id="set-catalog-filter">
          <option value="all">All</option>
          <option value="games">Games</option>
        </select>
      </label>
      <label class="field check">
        <input id="set-catalog-refresh" type="checkbox"> Refresh catalog on launch
      </label>
    </div>
    <button id="settings-save" class="btn btn-primary">Save settings</button>
  </section>
</main>

<dialog id="modal"></dialog>
<div id="toast" class="toast" hidden></div>

<script src="/app.js"></script>
</body>
</html>
