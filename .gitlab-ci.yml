stages:
  - test
  - build
  - deploy
  - release

include:
  - template: Jobs/Secret-Detection.latest.gitlab-ci.yml
    rules:
      - if: $CI_PIPELINE_SOURCE != "schedule"
  - template: Jobs/SAST.latest.gitlab-ci.yml
    rules:
      - if: $CI_PIPELINE_SOURCE != "schedule"

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  RELEASE_VERSION:
    value: ""
    description: "Build version (e.g. 1.7.1). If left blank, uses scripts/version.py. Only a tag publishes a release."
  SECRET_DETECTION_EXCLUDED_PATHS: "vendor, tests/fixtures, bug-reports"
  SAST_EXCLUDED_PATHS: "vendor, tests/fixtures, bug-reports"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"

test_pc:
  stage: test
  image: debian:bookworm-slim
  tags:
    - arch-local
  timeout: 20 minutes
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends build-essential git python3 pkg-config ca-certificates libcurl4-openssl-dev libssl-dev libzstd-dev zlib1g-dev p7zip-full
  script:
    - python3 scripts/check_source_lists.py
    - python3 scripts/check_i18n.py
    - python3 scripts/check_web_i18n.py
    - make -f Makefile.pc -j2 all test

test_web:
  stage: test
  image: node:22-bookworm-slim
  tags:
    - arch-local
  timeout: 15 minutes
  variables:
    GIT_SUBMODULE_STRATEGY: none
    PLAYWRIGHT_MODULE: /tmp/pipensx-browser/node_modules/playwright
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success
  script:
    - npm install --prefix /tmp/pipensx-browser --no-audit --no-fund playwright@1.65.0
    - /tmp/pipensx-browser/node_modules/.bin/playwright install --with-deps chromium
    - node tests/web_companion.cjs

mirror_langegen:
  stage: deploy
  image: python:3.13-slim
  variables:
    GIT_SUBMODULE_STRATEGY: none
  resource_group: langegen-mirror
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends zstd ca-certificates
  script:
    - python3 tests/test_catalog_mirror.py
    - python3 scripts/mirror_langegen.py --publish

build_switch:
  stage: build
  image: devkitpro/devkita64:latest
  tags:
    - arch-local
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git ca-certificates zstd zip
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        VERSION="$CI_COMMIT_TAG"
      elif [ -n "$RELEASE_VERSION" ]; then
        VERSION="$RELEASE_VERSION"
      else
        VERSION="$(python3 scripts/version.py)"
      fi
      echo "Building pipensx version: ${VERSION}"
      echo "RELEASE_TAG=${VERSION}" > build.env
      PIPENSX_VERSION="$(python3 scripts/version.py --version "$VERSION")"
      export PIPENSX_VERSION
      if [ -n "$CI_COMMIT_TAG" ]; then
        test "$(cat VERSION)" = "$PIPENSX_VERSION"
        cp "releases/${PIPENSX_VERSION}-notes.md" build-release-notes.md
      else
        printf 'Development build %s.\n' "$PIPENSX_VERSION" > build-release-notes.md
      fi
      export PIPENSX_ENABLE_LTO="ON"
    - make switch
    - mv build-release-notes.md build-switch/release-notes.md
    - (cd build-switch && sha256sum pipensx.nro > pipensx.nro.sha256)
    - mkdir -p build-switch/sdcard/switch/pipensx
    - cp build-switch/pipensx.nro build-switch/sdcard/switch/pipensx/pipensx.nro
    - (cd build-switch/sdcard && zip -r -q ../SDOut.zip switch)
  artifacts:
    reports:
      dotenv: build.env
    paths:
      - build-switch/pipensx.nro
      - build-switch/pipensx.nro.sha256
      - build-switch/SDOut.zip
      - build-switch/release-notes.md
    expire_in: 1 week

publish_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  tags:
    - arch-local
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: build_switch
      artifacts: true
  before_script:
    - apk add --no-cache curl
    - (cd build-switch && sha256sum -c pipensx.nro.sha256)
    - |
      echo "Uploading pipensx.nro and checksum to GitLab Generic Package Registry..."
      curl --fail-with-body --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file build-switch/pipensx.nro \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/pipensx/${RELEASE_TAG}/pipensx.nro"
      curl --fail-with-body --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file build-switch/pipensx.nro.sha256 \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/pipensx/${RELEASE_TAG}/pipensx.nro.sha256"
      curl --fail-with-body --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file build-switch/SDOut.zip \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/pipensx/${RELEASE_TAG}/SDOut.zip"
  script:
    - echo "Publishing release ${RELEASE_TAG}..."
  release:
    tag_name: "${RELEASE_TAG}"
    name: "Release ${RELEASE_TAG}"
    description: "./build-switch/release-notes.md"
    ref: "${CI_COMMIT_SHA}"
    assets:
      links:
        - name: "SDOut.zip"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/pipensx/${RELEASE_TAG}/SDOut.zip"
          filepath: "/SDOut.zip"
          link_type: "package"
        - name: "pipensx.nro"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/pipensx/${RELEASE_TAG}/pipensx.nro"
          filepath: "/pipensx.nro"
          link_type: "package"
        - name: "pipensx.nro.sha256"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/pipensx/${RELEASE_TAG}/pipensx.nro.sha256"
          filepath: "/pipensx.nro.sha256"
          link_type: "package"

pages:
  stage: deploy
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - mkdir -p public
    - cp -r site/* public/
  artifacts:
    paths:
      - public
